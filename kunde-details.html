<!DOCTYPE html>
<html lang="de-DE">

<head>
    <meta charset="utf-8">
    <title>Kundendetails</title>

    <link rel="stylesheet" href="index.css">
    <script src="main.js" defer></script>
</head>

<body>
    <h1>Kundenverwaltung</h1>

    <h2>Kundendetails</h2>

    <fieldset>
        <legend>Stammdaten</legend>

        <div>
            Kundennummer:
            <span id="kundennummer"></span>
        </div>

        <div>
            Vorname:
            <span id="vorname"></span>
        </div>

        <div>
            Nachname:
            <span id="nachname"></span>
        </div>

        <div>
            Geburtsdatum:
            <span id="geburtsdatum"></span>
        </div>

        <div>
            Geschlecht:
            <span id="geschlecht"></span>
        </div>

        <div>
            E-Mail-Adresse:
            <span id="email"></span>
        </div>
    </fieldset>

    <fieldset>
        <legend>Adresse</legend>
    
        <div>
            Straße:
            <span id="straße"></span>
        </div>

        <div>
            Hausnummer:
            <span id="hausnummer"></span>
        </div>

        <div>
            Postleitzahl:
            <span id="postleitzahl"></span>
        </div>

        <div>
            Ort:
            <span id="ort"></span>
        </div>
    </fieldset>

    <fieldset>
        <legend>Kundenstatus</legend>
        <span id="kundenstatus"></span>
    </fieldset>

    <fieldset>
        <legend>Notizen</legend>
        <span id="notizen"></span>
    </fieldset>

    <button type="button">Kunde bearbeiten</button>
    <button type="button">Kunde löschen</button>

</body>

</html>
