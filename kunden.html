<!DOCTYPE html>
<html lang="de-DE">

<head>
    <meta charset="utf-8">
    <title>Kundenübersicht</title>

    <link rel="stylesheet" href="index.css">
    <script src="main.js" defer></script>
</head>

<body>
    <h1>Kundenverwaltung</h1>

    <h2>Kundenübersicht</h2>

    <!--Suchfunktion-->
    <div>
        <label for="suche">Kunden suchen</label>
        <input 
            id="suche"
            name="suche"
            type="search"
            placeholder="Kunden suchen"
            >
    </div>
    <!--Kundentabelle-->
    <table>

        <thead>
            <tr>
                <th>Kundennummer</th>
                <th>Name</th>
                <th>E-Mail-Adresse</th>
            </tr>
        </thead>

        <tbody id="kundenTabelle"> 
            <!-- Kunden werden später eingefügt --> 
        </tbody>
        
    </table>



</body>
</html>
